<text x="640" y="73" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="16" fill="#bacbd1">vigil · public CLI help</text>
<text x="90" y="142" font-family="Menlo,monospace" font-size="19" fill="#f2e7d4">&gt; vigil --help</text>
<text x="90" y="172" font-family="Menlo,monospace" font-size="19" fill="#bacbd1">vigil</text>
<text x="90" y="202" font-family="Menlo,monospace" font-size="19" fill="#bacbd1">Policy-aware repository preflight engine</text>
<text x="90" y="232" font-family="Menlo,monospace" font-size="19" fill="#bacbd1"></text>
<text x="90" y="246" font-family="Menlo,monospace" font-size="19" fill="#bacbd1">Usage:</text>
<text x="90" y="276" font-family="Menlo,monospace" font-size="19" fill="#bacbd1">  vigil [--config PATH] [--allow-mutation|--auto] &lt;command&gt; [args]</text>
<text x="90" y="306" font-family="Menlo,monospace" font-size="19" fill="#bacbd1"></text>
<text x="90" y="320" font-family="Menlo,monospace" font-size="19" fill="#bacbd1">core</text>
<text x="90" y="350" font-family="Menlo,monospace" font-size="19" fill="#bacbd1">  r   advanced                             Show every command and advanced...</text>
<text x="90" y="380" font-family="Menlo,monospace" font-size="19" fill="#bacbd1">  w   apply                                Verify and execute an unchanged...</text>
<text x="90" y="410" font-family="Menlo,monospace" font-size="19" fill="#bacbd1">  r/w check                                Run the normal project checks.</text>
<text x="90" y="440" font-family="Menlo,monospace" font-size="19" fill="#bacbd1">  w   cleanliness:clean                    Delete reviewed disposable local...</text>
<text x="90" y="470" font-family="Menlo,monospace" font-size="19" fill="#bacbd1">  r   cleanliness:scan                     Report disposable local artifacts...</text>
<text x="90" y="500" font-family="Menlo,monospace" font-size="19" fill="#bacbd1">  r   doctor                               Check local readiness</text>
<text x="90" y="530" font-family="Menlo,monospace" font-size="19" fill="#bacbd1"></text>
